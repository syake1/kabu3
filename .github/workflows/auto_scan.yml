name: 自動スキャン（9:30〜14:30）
on:
  schedule:
    # JST = UTC+9 なので UTC時間で設定
    - cron: '30 0 * * 1-5'  # 月〜金 9:30 JST
    - cron: '0  1 * * 1-5'  # 月〜金 10:00 JST
    - cron: '0  2 * * 1-5'  # 月〜金 11:00 JST
    - cron: '0  3 * * 1-5'  # 月〜金 12:00 JST
    - cron: '0  4 * * 1-5'  # 月〜金 13:00 JST
    - cron: '30 5 * * 1-5'  # 月〜金 14:30 JST
  workflow_dispatch:        # 手動実行ボタン

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: ライブラリインストール
        run: |
          pip install --upgrade pip
          pip install \
            "yfinance>=0.2.54" \
            "pandas>=2.0" \
            "numpy>=1.24" \
            gspread \
            google-auth \
            streamlit \
            plotly

      - name: 自動スキャン実行
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_PASS: ${{ secrets.GMAIL_PASS }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          python auto_scan.py
